services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: flask_backend
    ports:
      - "9000:9000"
    restart: always
    networks:
      - app_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: node_frontend
    ports:
      - "3000:3000"
    restart: always
    depends_on:
      - backend
    networks:
      - app_network

networks:
  app_network:
    driver: bridge