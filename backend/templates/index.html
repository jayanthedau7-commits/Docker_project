<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <style>
        body {
            background-color: bisque;
            font-family: Arial, Helvetica, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            width: 340px;
            text-align: center;
        }

        h2 {
            margin-top: 0;
        }

        .time-box {
            font-size: 14px;
            color: #555;
            margin-bottom: 20px;
        }

        .error-box {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 15px;
            font-size: 14px;
        }

        input {
            width: 90%;
            padding: 10px;
            margin: 8px 0 16px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        label {
            font-weight: bold;
            display: block;
            text-align: left;
            margin-left: 5%;
        }

        button {
            width: 96%;
            padding: 10px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>

<body>
    <div class="card">
        <h2>Sign Up Form</h2>
        <div class="time-box">
            Today is <b>{{ day_of_week }}</b><br>
            Current Time: <b>{{ current_time }}</b>
        </div>

        <!-- Render Error gracefully if database/validation fails -->
        {% if error %}
        <div class="error-box">
            {{ error }}
        </div>
        {% endif %}

        <form action="/submit" method="POST">
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" value="{{ form_data.name if form_data else '' }}" required>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" value="{{ form_data.email if form_data else '' }}" required>

            <button type="submit">Submit</button>
        </form>
    </div>
</body>

</html>
